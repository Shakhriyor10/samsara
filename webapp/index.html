    .pti-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.pti-flash.go{animation:pti-flash .35s ease-out}@keyframes pti-flash{0%{opacity:.85}100%{opacity:0}}
    .pti-controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 18px calc(18px + env(safe-area-inset-bottom))}.pti-controls[hidden],.pti-review-bar[hidden]{display:none}.pti-where{justify-self:start;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;color:#ffffffd1;font:inherit;padding:0;min-width:64px}.pti-where>span{width:62px;height:48px;border-radius:12px;background:#eef4ff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px #ffffff40}.pti-where svg{width:60px;height:46px}.pti-where small{font-size:11px;font-weight:650}
    .pti-shutter{width:80px;height:80px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px;display:grid}.pti-shutter span{border-radius:50%;background:#fff;transition:transform .12s ease}.pti-shutter:active:not(:disabled) span{transform:scale(.86)}.pti-shutter:disabled{opacity:.35}.pti-done-count{justify-self:end;text-align:center;min-width:64px}.pti-done-count strong{display:block;font-size:19px;font-weight:750}.pti-done-count small{font-size:11px;color:#ffffffb8;font-weight:650}
    .pti-review-bar{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}.pti-review-bar button{min-height:56px;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:8px}.pti-review-bar svg{width:20px;height:20px}.pti-retake{background:#ffffff1f;color:#fff}.pti-use{background:#2678ed;color:#fff}
    .pti-guide-sheet{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;background:#05090f8c;animation:pti-fade .2s ease}.pti-guide-sheet[hidden]{display:none}.pti-guide-card{width:100%;max-height:92%;overflow-y:auto;background:#fff;color:var(--ink);border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));animation:pti-up .36s cubic-bezier(.22,1,.36,1)}.pti-guide-step{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:#2a64c4}.pti-guide-card h2{margin:4px 0 14px;font-size:25px;letter-spacing:-.4px}.pti-guide-art{background:#f3f7fd;border-radius:16px;display:grid;place-items:center;padding:12px}.pti-guide-art svg{width:100%;max-width:320px;height:auto;max-height:30vh}.pti-guide-card p{font-size:15px;line-height:1.5;color:#33475f;margin:14px 0 18px}.pti-guide-go{width:100%;min-height:56px;border:0;border-radius:14px;background:#2678ed;color:#fff;font:inherit;font-size:16px;font-weight:750}@keyframes pti-up{from{transform:translateY(100%)}to{transform:none}}@keyframes pti-fade{from{opacity:0}to{opacity:1}}
    .pti-page{position:absolute;inset:0;z-index:9;background:#f5f7fa;color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:pti-fade .2s ease}.pti-page[hidden]{display:none}.ptir-head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}.ptir-head div{text-align:center}.ptir-head div span{display:block;font-size:12px;color:#5f7187;font-weight:600}.ptir-head strong{font-size:17px}.ptir-body{flex:1;overflow-y:auto;padding:16px}.ptir-sub{margin:0 0 14px;font-size:14px;color:#5f7187;line-height:1.5}.ptir-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.ptir-tile{position:relative;margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.ptir-tile img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9eef5}.ptir-tile figcaption{display:flex;align-items:center;gap:6px;padding:9px 10px}.ptir-tile figcaption span{font-size:13px;font-weight:700;min-width:0;line-height:1.3}.ptir-tile b{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e3ecff;color:#1f5fc4;font-size:11px}.ptir-tile button{position:absolute;top:8px;right:8px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:#0b1a2ecc;backdrop-filter:blur(6px);color:#fff;font:inherit;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}.ptir-tile button svg{width:14px;height:14px}.ptir-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}.ptir-foot .primary{margin:0;min-height:56px;font-size:16px}.ptir-progress{height:6px;border-radius:3px;background:#e7edf5;overflow:hidden;margin-bottom:10px}.ptir-progress[hidden]{display:none}.ptir-progress span{display:block;height:100%;width:0;background:#2678ed;transition:width .2s}
    .ptid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}.ptid-badge{width:92px;height:92px;border-radius:50%;background:#e6f7ee;color:#1c8a57;display:grid;place-items:center;animation:pti-pop .5s cubic-bezier(.22,1.4,.36,1)}.ptid-badge svg{width:46px;height:46px}@keyframes pti-pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}.ptid h2{font-size:26px;margin:20px 0 8px}.ptid p{color:#5f7187;line-height:1.55;margin:0 0 26px;font-size:15px}.ptid .primary{max-width:320px;margin:0;min-height:54px}
    .pti-confirm{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:#05090fb3;animation:pti-fade .15s ease}.pti-confirm[hidden]{display:none}.pti-confirm-card{width:min(360px,100%);background:#fff;color:var(--ink);border-radius:18px;padding:22px}.pti-confirm-card h2{margin:0 0 8px;font-size:19px}.pti-confirm-card p{margin:0 0 18px;color:#5f7187;font-size:14px;line-height:1.5}.pti-confirm-card div{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pti-confirm-card button{min-height:48px;border:0;border-radius:12px;background:#f1f4f8;color:var(--ink);font:inherit;font-weight:700}.pti-confirm-card .danger{background:#cc4e4e;color:#fff}
    @media(orientation:landscape) and (max-height:500px){.pti-progress{margin-bottom:6px}.pti-controls{padding-block:6px calc(6px + env(safe-area-inset-bottom))}.pti-shutter{width:62px;height:62px}.pti-review-bar{padding-block:8px}.pti-review-bar button{min-height:46px}.pti-guide-art svg{max-height:22vh}}

<body>
<div class="app">
  <header class="topbar"><div class="brand-mark">F</div><div class="brand">FleetBot</div><div class="badge" id="roleBadge">ADMIN</div><button class="gear" id="settingsButton" aria-label="PTI settings" onclick="renderPtiSettings()">⚙</button></header>
  <main id="view"><div class="loading">Connecting to FleetBot…</div></main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-btn active" data-tab="trucks" onclick="switchTab('trucks')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h12v11H3zM15 10h4l3 3v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>Trucks</button>
    <button class="nav-btn" data-tab="pti" onclick="switchTab('pti')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16v12H4zM8 8l1.5-3h5L16 8"/><circle cx="12" cy="14" r="3"/></svg>PTI</button>
    <button class="nav-btn" data-tab="alerts" onclick="switchTab('alerts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span class="alert-badge" id="alertsBadge" hidden>0</span>Alerts</button>
    <button class="nav-btn" data-tab="reports" onclick="switchTab('reports')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h17M7 17V9h3v8M13 17V5h3v12M19 17v-5h3v5"/></svg>Reports</button>
  </nav>
</div><div class="toast" id="toast"></div>
<div class="confirm-overlay" id="groupRemoveConfirm" hidden onclick="if(event.target===this)closeGroupRemoveConfirm()">
  <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="groupRemoveTitle" aria-describedby="groupRemoveMessage">
    <h2 id="groupRemoveTitle">Unlink Telegram group?</h2>
    <p id="groupRemoveMessage">Are you sure you want to unlink this truck from this Telegram group?</p>
    <div class="confirm-actions"><button class="confirm-cancel" id="cancelGroupRemove" onclick="closeGroupRemoveConfirm()">Cancel</button><button class="confirm-remove" id="confirmGroupRemove" onclick="confirmRemoveTruckGroup()">Remove group</button></div>
  </section>
</div>
<div class="sheet-overlay" id="driverSheet" hidden onclick="if(event.target===this)closeDriverSheet()">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="driverSheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="driverSheetTitle">Change driver</h2><button class="sheet-close" aria-label="Close" onclick="closeDriverSheet()">×</button></div>
    <div class="sheet-current" id="driverSheetCurrent"></div>
    <label for="sheetDriverId">New driver Telegram user ID<input id="sheetDriverId" type="text" inputmode="numeric" autocomplete="off" placeholder="User ID"></label>
    <label for="sheetDriverName">Name<input id="sheetDriverName" type="text" maxlength="100" placeholder="Driver name"></label>
    <div class="sheet-note" id="driverSheetNote"></div>
    <div class="sheet-actions"><button class="sheet-cancel" onclick="closeDriverSheet()">Cancel</button><button class="sheet-save" id="driverSheetSave" onclick="saveDriverChange()">Save driver</button></div>
  </section>
</div>
<div class="photo-lightbox" id="photoLightbox" hidden onclick="if(event.target===this)closePhotoPreview()" role="dialog" aria-modal="true" aria-label="PTI photo preview">
  <button id="photoLightboxClose" class="photo-lightbox-close" onclick="closePhotoPreview()" aria-label="Close photo preview">×</button>
  <img id="photoLightboxImage" alt="">
  <video id="photoLightboxVideo" controls playsinline hidden></video>
  <div class="photo-lightbox-caption" id="photoLightboxCaption"></div>
</div>
<script>
  const tg = window.Telegram?.WebApp;
  const initData = tg?.initData || '';
  function newYorkDateString(offsetDays=0){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value]));const d=new Date(Date.UTC(Number(parts.year),Number(parts.month)-1,Number(parts.day)+offsetDays));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
  function formatNewYorkDateTime(value){const date=new Date(value);return Number.isNaN(date.getTime())?'Time unavailable':new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',dateStyle:'medium',timeStyle:'short'}).format(date)}
  const state = {tab:'trucks',role:'admin',user:null,driverStatus:null,ptiCameraStream:null,ptiCaptureSession:0,ptiPhotoIndex:0,ptiPhotos:{},ptiAnswers:{},ptiRecorder:null,ptiModes:{},ptiHistorySelection:null,filter:'all',trucks:[],selectedTruck:null,truckPti:null,truckPtiLoading:false,truckPtiError:'',ptiArchiveReturn:'settings',events:[],selectedEvent:null,videoUrl:null,eventReturn:'truck',alertFrom:newYorkDateString(-6),alertTo:newYorkDateString(),alertTruck:'all',alertEvents:[],liveAlerts:[],seenAlertIds:new Set(),unreadAlertIds:new Set(),liveAlertCursor:null,liveAlertPolling:false,liveAlertTimer:null,alertListVisible:false,alertSearched:false,alertLoading:false,alertError:'',alertRequestId:0,alertBadgeCount:0,truckEventFrom:newYorkDateString(-6),truckEventTo:newYorkDateString(),truckEventLoading:false,truckEventError:'',pendingGroupRemoval:null,pendingConfirm:null,groupRemoveBusy:false,driverSaveBusy:false,botGroups:null,botGroupsLoading:false,botGroupsError:'',groupAddBusy:false};
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#f5f7fa'); }
  window.addEventListener('pagehide',()=>{stopPtiCamera();revokePtiPhotoUrls();state.archiveUrls?.forEach(url=>URL.revokeObjectURL(url));clearEventVideo()});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!document.getElementById('photoLightbox').hidden)closePhotoPreview();else if(!document.getElementById('driverSheet').hidden)closeDriverSheet();else closeGroupRemoveConfirm()}});
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  document.getElementById('view').addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;if(target.dataset.action==='truck')openTruck(target.dataset.account,target.dataset.id);if(target.dataset.action==='event')openEvent(target.dataset.id);if(target.dataset.action==='alert-event')openAlertEvent(target.dataset.account,target.dataset.truck,target.dataset.id);if(target.dataset.action==='group-remove')removeTruckGroup(target.dataset.id);if(target.dataset.action==='play-video')playEventVideo();if(target.dataset.action==='photo-preview')openPhotoPreview(target.dataset.src,target.dataset.label);if(target.dataset.action==='video-preview')openVideoPreview(target.dataset.submission,target.dataset.key,target.dataset.label)});
  const truckSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h12v11H3zM15 10h4l3 3v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>';
  async function api(path, options={}) {
    const response = await fetch(path,{...options,headers:{'X-Telegram-Init-Data':initData,'Content-Type':'application/json',...(options.headers||{})}});
    if (!response.ok) throw new Error(await response.text() || `Request failed (${response.status})`);
    return response.json();
  }
  async function apiBlob(path){const response=await fetch(path,{headers:{'X-Telegram-Init-Data':initData}});if(!response.ok)throw new Error(await response.text()||`Request failed (${response.status})`);return response.blob()}
  function clearEventVideo(){if(state.videoUrl){URL.revokeObjectURL(state.videoUrl);state.videoUrl=null}}
  function toast(message,duration=3000){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._hideTimer);el._hideTimer=setTimeout(()=>el.classList.remove('show'),duration)}
  function setView(html,keepScroll=false){state.viewKey=null;document.getElementById('view').innerHTML=html;if(!keepScroll&&window.scrollY>0)window.scrollTo({top:0,behavior:'auto'})}
  function showError(message){setView(`<div class="error">${esc(message)}</div>`)}
  function switchTab(tab){clearEventVideo();state.selectedTruck=null;state.selectedEvent=null;if(state.role==='driver'){state.ptiCaptureSession++;stopPtiCamera();closePtiShell();const driverTab=tab==='trucks'?'today':tab==='alerts'?'activity':tab;state.tab=driverTab;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',(driverTab==='today'&&b.dataset.tab==='trucks')||(driverTab==='pti'&&b.dataset.tab==='pti')||(driverTab==='activity'&&b.dataset.tab==='alerts')));if(driverTab==='today')renderDriverToday();else if(driverTab==='pti')renderDriverPti();else renderDriverActivity();return}state.tab=tab;state.alertListVisible=tab==='alerts';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='trucks'){renderTrucks()}else if(tab==='alerts'){state.unreadAlertIds.clear();updateAlertsBadge();renderAlerts();if(!state.alertSearched&&!state.alertLoading)loadAlerts()}else if(tab==='pti'){renderPtiSettings()}else{setView('<section class="placeholder"><div class="placeholder-icon">📊</div><strong>Reports</strong><span>This section will be available in a later step.</span></section>')}}
  function configureDriverNavigation(){document.getElementById('roleBadge').textContent='DRIVER';document.getElementById('settingsButton').hidden=true;const nav=document.querySelector('.bottom-nav');nav.classList.add('driver-nav');const buttons=[...document.querySelectorAll('.nav-btn')];buttons[0].innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h12v11H3zM15 10h4l3 3v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>Today';buttons[0].dataset.tab='trucks';buttons[1].innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16v12H4zM8 8l1.5-3h5L16 8"/><path d="m8 14 2.5 2.5L16 11"/></svg>My PTI';buttons[1].dataset.tab='pti';buttons[2].innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h17M7 17V9h3v8M13 17V5h3v12M19 17v-5h3v5"/></svg>Activity';buttons[2].dataset.tab='alerts';buttons[3].hidden=true}
  async function refreshDriverStatus(){state.driverStatus=await api('/api/pti/status');return state.driverStatus}
  function driverDueLabel(){const s=state.driverStatus;if(!s)return 'Loading PTI status…';return s.isDue?'PTI due now':`Next PTI due ${formatNewYorkDateTime(s.dueAt)}`}

  function stopPtiRecording(rec,discard=false){if(!rec||rec.stopping)return;rec.stopping=true;rec.discard=discard;clearInterval(rec.timer);if(rec.recorder.state!=='inactive')rec.recorder.stop();else finishPtiRecording(rec)}
  function cancelPtiRecording(){if(!state.ptiRecorder)return;stopPtiRecording(state.ptiRecorder,true);showPtiStep(false)}
  function finishPtiRecording(rec){if(rec.finished)return;rec.finished=true;rec.audio?.getTracks().forEach(track=>track.stop());if(state.ptiRecorder===rec)state.ptiRecorder=null;const shell=ptiEl('ptiShell');shell?.classList.remove('recording');ptiEl('ptiShutter')?.classList.remove('next');if(rec.discard||!shell)return;const type=(rec.recorder.mimeType||ptiRecorderMime()||'video/webm').split(';')[0]||'video/webm',blob=new Blob(rec.chunks,{type});if(!blob.size){toast('The recording is empty. Try again.');showPtiStep(false);return}const old=state.ptiPhotos[rec.step.key];if(old?.url)URL.revokeObjectURL(old.url);state.ptiPhotos[rec.step.key]={blob,url:URL.createObjectURL(blob),video:true,seconds:(performance.now()-rec.startedAt)/1000};tg?.HapticFeedback?.notificationOccurred?.('success');if(ptiStep()===rec.step)showPtiShot()}
  function showPtiShot(){const step=ptiStep(),capture=state.ptiPhotos[step.key];if(!capture)return;ptiEl('ptiShell').classList.add('reviewing');ptiEl('ptiCamera').hidden=true;ptiEl('ptiRec').hidden=true;ptiEl('ptiNa').hidden=true;if(capture.video){const playback=ptiEl('ptiPlayback');playback.src=capture.url;playback.hidden=false;ptiEl('ptiShot').hidden=true}else{const shot=ptiEl('ptiShot');shot.src=capture.url;shot.alt=`${step.title} photo`;shot.hidden=false}ptiEl('ptiControls').hidden=true;ptiEl('ptiReviewBar').hidden=false;const psi=step.input==='psi';ptiEl('ptiPsiWrap').hidden=!psi;if(psi)ptiEl('ptiPsi').value=state.ptiAnswers[step.key]?.psi??'';ptiEl('ptiUse').innerHTML=`${PTI_ICONS.check}${capture.video?'Use video':'Use photo'}`;ptiEl('ptiHint').hidden=!!capture.video;ptiEl('ptiHint').textContent='Is everything clear and inside the frame?';ptiEl('ptiCount').textContent=`Check ${capture.video?'video':'photo'} · ${state.ptiPhotoIndex+1}/${ptiSteps().length}`;state.ptiCameraStream?.getVideoTracks().forEach(track=>track.enabled=false);(psi?ptiEl('ptiPsi'):ptiEl('ptiUse')).focus({preventScroll:true})}

  function renderPtiReview(){const shell=ptiShell();closePtiGuide();ptiResetPlayback();state.ptiCameraStream?.getVideoTracks().forEach(track=>track.enabled=false);const steps=ptiSteps(),page=ptiEl('ptiReviewPage');let section='';const tiles=steps.map((step,index)=>{const capture=state.ptiPhotos[step.key],answer=state.ptiAnswers[step.key]||{};const heading=step.section!==section?`<h3 class="ptir-section">${esc(step.sectionTitle)}</h3>`:'';section=step.section;let media,action;if(capture?.video){media=`<div class="ptir-video"><video src="${capture.url}#t=0.1" preload="metadata" muted playsinline></video><span>${PTI_ICONS.play}${ptiSecondsLabel(capture.seconds||0)}</span></div>`;action=`${PTI_ICONS.retake}Redo`}else if(capture){media=`<img src="${capture.url}" alt="${esc(step.title)} photo">`;action=`${PTI_ICONS.retake}Retake`}else if(answer.result){media=`<div class="ptir-answer ${answer.result}">${answer.result==='pass'?'PASS':'FAIL'}</div>`;action='Change'}else{media='<div class="ptir-answer na">Not applicable</div>';action='Undo'}return `${heading}<figure class="ptir-tile">${media}<button onclick="retakePtiPhoto(${index})" aria-label="Redo ${esc(step.title)}">${action}</button><figcaption><b>${index+1}</b><span>${esc(step.title)}${answer.psi?` · ${esc(answer.psi)} PSI`:''}</span></figcaption></figure>`}).join('');const fails=steps.filter(step=>state.ptiAnswers[step.key]?.result==='fail').length;page.innerHTML=`<header class="ptir-head"><button class="pti-icon light" onclick="askCancelPti()" aria-label="Stop inspection">${PTI_ICONS.close}</button><div><span>All ${steps.length} steps done</span><strong>Check your inspection</strong></div><span></span></header><div class="ptir-body"><p class="ptir-sub">Tap <b>Retake</b> or <b>Redo</b> on anything that is blurry or doesn’t show the whole area.</p>${fails?`<p class="ptir-warn">${fails} ${fails===1?'check is':'checks are'} marked Fail. Your fleet manager will see this in the report.</p>`:''}<div class="ptir-grid">${tiles}</div></div><footer class="ptir-foot"><div class="ptir-progress" id="ptiUpload" hidden><span id="ptiUploadBar"></span></div><button class="primary" id="submitPti" onclick="submitPtiInspection()">Submit PTI</button></footer>`;page.hidden=false;shell.classList.add('on-page')}
  async function retakePtiPhoto(index){const step=ptiSteps()[index],old=state.ptiPhotos[step.key];if(old?.url)URL.revokeObjectURL(old.url);delete state.ptiPhotos[step.key];delete state.ptiAnswers[step.key];state.ptiPhotoIndex=index;ptiEl('ptiShell')?.classList.remove('on-page');showPtiStep(false);if(!state.ptiCameraStream)await startPtiCamera()}
  function uploadPtiForm(form,onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST','/api/pti/submit');xhr.setRequestHeader('X-Telegram-Init-Data',initData);xhr.upload.onprogress=event=>{if(event.lengthComputable)onProgress(event.loaded/event.total)};xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(new Error(xhr.responseText||`Could not submit PTI (${xhr.status})`));xhr.onerror=()=>reject(new Error('Network error. Check your connection and try again.'));xhr.send(form)})}
  function ptiFileExtension(type){return type.includes('mp4')?'mp4':type.includes('quicktime')?'mov':type.includes('webm')||type.includes('matroska')?'webm':'jpg'}
  async function submitPtiInspection(){const button=ptiEl('submitPti'),bar=ptiEl('ptiUpload'),fill=ptiEl('ptiUploadBar');if(!button||button.disabled)return;button.disabled=true;button.textContent='Uploading…';bar.hidden=false;fill.style.width='4%';try{const form=new FormData();for(const step of ptiSteps()){const capture=state.ptiPhotos[step.key];if(capture)form.append(step.key,capture.blob,`${step.key}.${ptiFileExtension(capture.blob.type)}`)}form.append('answers',JSON.stringify(state.ptiAnswers));await uploadPtiForm(form,progress=>{const percent=Math.round(progress*100);fill.style.width=`${Math.max(4,percent)}%`;button.textContent=percent<100?`Uploading ${percent}%`:'Saving…'});stopPtiCamera();revokePtiPhotoUrls();tg?.HapticFeedback?.notificationOccurred?.('success');let next='';try{await refreshDriverStatus();next=`Next PTI due ${formatNewYorkDateTime(state.driverStatus.dueAt)}.`}catch(_){}renderPtiSuccess(next)}catch(error){toast(error.message||'Could not submit the PTI.',7000);button.disabled=false;button.textContent='Try again';bar.hidden=true}}

  async function renderPtiSettings(){
    if(state.role==='driver')return renderDriverPti();
    try{
      const [settings,groups]=await Promise.all([api('/api/pti/settings'),api('/api/groups').then(data=>data.groups||[]).catch(()=>[])]);
      state.ptiReturnedReasons=Object.fromEntries(settings.drivers.filter(d=>d.isInvalidated).map(d=>[d.submissionId,d.invalidationReason||'PTI returned']));
      const drivers=settings.drivers.map(d=>{
        const status=d.isInvalidated?'Returned':d.isDue?'Due':'On schedule';
        const statusClass=d.isInvalidated?'returned':d.isDue?'due':'good';
        const statusGlyph=d.isInvalidated?'↻':d.isDue?'!':'✓';
        const actions=d.submissionId?`<div class="pti-actions"><button class="pti-action" aria-label="View latest PTI" onclick="openAdminPtiArchive('${d.submissionId}','settings','${d.lastSubmittedAt||''}')">View</button>${d.isInvalidated?`<button class="pti-action" aria-label="Resend driver notice" onclick="resendPtiNotice('${d.submissionId}')">Resend</button>`:`<button class="pti-action danger" aria-label="Return PTI" onclick="invalidatePti('${d.submissionId}','settings')">Return</button>`}<button class="pti-action" aria-label="Request PTI" onclick="sendPtiReminder('${d.accountId}','${d.truckId}')">Request PTI</button></div>`:`<div class="pti-actions request"><button class="pti-action" aria-label="Request PTI" onclick="sendPtiReminder('${d.accountId}','${d.truckId}')">Request PTI</button></div>`;
        const modeLabel=d.ptiPhotos&&d.ptiVideo?'Photos + video':d.ptiVideo?'Video only':'Photos only';
        return `<div class="event-card pti-driver-card"><span class="pti-status-icon ${statusClass}" aria-label="${status}">${statusGlyph}</span><span class="event-content"><strong class="pti-truck-title">${esc(d.truckName)} · ${esc(d.company)}</strong><span class="pti-driver-meta">${esc(d.name)} · Telegram ${esc(d.telegramUserId)} · ${modeLabel}</span><span class="pti-status-line ${statusClass}">${d.lastSubmittedAt?`Last PTI · ${esc(formatNewYorkDateTime(d.lastSubmittedAt))} · `:''}${status}${d.invalidationReason?`<br>Reason: ${esc(d.invalidationReason)}`:''}</span>${actions}</span></div>`;
      }).join('');
      const intervals=[8,12,24,48,72,168];if(!intervals.includes(settings.intervalHours))intervals.push(settings.intervalHours);intervals.sort((a,b)=>a-b);
      const reminders=[1,2,3,4,6,8,12,24];if(!reminders.includes(settings.reminderHours))reminders.push(settings.reminderHours);reminders.sort((a,b)=>a-b);
      const current=settings.reportGroup,groupList=[...groups];if(current&&!groupList.some(g=>g.id===current.id))groupList.unshift(current);
      const groupOptions=`<option value="">${current?'Don’t send PTI reports':groupList.length?'Choose a group…':'No groups found'}</option>${groupList.map(g=>`<option value="${esc(g.id)}" ${current?.id===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}<option value="__manual">Enter group ID manually…</option>`;
      setView(`<button class="back" onclick="switchTab('trucks')">‹ Trucks</button><section class="pti-set"><h1>PTI settings</h1><p>Set how often drivers must submit PTI reports.</p><select id="ptiInterval" aria-label="PTI interval">${intervals.map(h=>`<option value="${h}" ${h===settings.intervalHours?'selected':''}>${h===168?'Once a week':`Once in ${h} hours`}</option>`).join('')}</select><h2>Reminders</h2><p>Set how often drivers receive PTI reminders, if they do not complete it on time.</p><select id="ptiReminder" aria-label="Reminder interval">${reminders.map(h=>`<option value="${h}" ${h===settings.reminderHours?'selected':''}>Every ${h} ${h===1?'hour':'hours'}</option>`).join('')}</select><h2>PTI reports group</h2><p>Set a group which receives all PTI reports.</p><select id="ptiReportGroup" aria-label="PTI reports group" onchange="document.getElementById('ptiReportManual').hidden=this.value!=='__manual'">${groupOptions}</select><input id="ptiReportManual" type="text" inputmode="numeric" autocomplete="off" placeholder="Telegram group ID, e.g. -1001234567890" aria-label="Telegram group ID" hidden><p class="pti-set-note">Each submitted PTI is posted there as a ZIP archive with all photos, videos and a report. The bot must be a member of the group.</p><button class="primary" id="ptiSaveSettings" onclick="savePtiSettings()">Save</button></section><div class="block-title">Driver compliance</div><p class="hint">${settings.linkedDrivers} driver account(s) linked. Drivers may start 4 hours before the next due time. Photo and video options are set on each truck.</p>${drivers||'<div class="empty">No drivers are linked yet. Open a truck to assign a Telegram user.</div>'}`);
    }catch(error){showError(error.message)}
  }

  async function requestAlerts(initializeLive=false){

  async function pollLiveAlerts(){if(!state.liveAlertCursor||state.liveAlertPolling||document.hidden)return;state.liveAlertPolling=true;try{const data=await api(`/api/alerts/live?${new URLSearchParams({since:state.liveAlertCursor})}`);state.liveAlertCursor=data.checkedAt||state.liveAlertCursor;const added=[];for(const e of data.events||[]){const key=alertKey(e);if(state.seenAlertIds.has(key))continue;state.seenAlertIds.add(key);state.liveAlerts.unshift(e);added.push(e);if(!state.alertListVisible)state.unreadAlertIds.add(key)}if(added.length){updateAlertsBadge();if(state.tab==='alerts')renderAlerts();toast(added.length===1?`New safety alert: ${added[0].truckName}`:`${added.length} new safety alerts`)}}catch(error){console.warn('Live alert polling failed',error)}finally{state.liveAlertPolling=false}}

  function normalizeGroupId(value){const digits=String(value||'').trim().replace(/\s+/g,'').replace(/^-+/,'');if(!/^\d{4,18}$/.test(digits))throw new Error('Enter a valid numeric Telegram group ID.');return `-${digits}`}
  async function linkTruckDriver(){const t=state.selectedTruck,id=document.getElementById('driverTelegramId')?.value.trim(),name=document.getElementById('driverName')?.value.trim();if(!t||!id){toast('Enter the driver Telegram user ID.');return}try{const data=await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/driver`,{method:'POST',body:JSON.stringify({telegramUserId:id,name,truckName:t.name})});t.driverAccount=data.driver;toast('Driver account linked. The driver can open /app in a private chat.');renderTruckDetail()}catch(error){toast(error.message||'Could not link driver account.')}}
  function toggleDriverCard(){state.driverCardOpen=!state.driverCardOpen;const card=document.getElementById('driverCard'),button=document.getElementById('driverCardToggle');if(!card||!button)return;card.classList.toggle('collapsed',!state.driverCardOpen);button.setAttribute('aria-expanded',String(state.driverCardOpen));button.querySelector('span').textContent=state.driverCardOpen?'Hide':'Show details'}
  function initialsOf(name){const parts=String(name||'').trim().split(/\s+/).filter(Boolean);return((parts[0]?.[0]||'?')+(parts[1]?.[0]||'')).toUpperCase()}
  function refreshSelectedTruckPti(){if(!state.selectedTruck)return;state.truckPtiLoading=true;loadTruckPti()}
  function removeTruckDriver(){const t=state.selectedTruck,driver=t?.driverAccount;if(!driver)return;openConfirm({title:`Unlink ${driver.name}?`,message:`${driver.name} will no longer be the driver of ${t.name} and loses access to its PTI app. Telegram groups stay linked to the truck.`,cta:'Unlink driver',busyText:'Unlinking…',errorText:'Could not unlink driver.',run:async()=>{await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/driver`,{method:'DELETE'});t.driverAccount=null;renderTruckDetail();refreshSelectedTruckPti();toast('Driver unlinked.')}})}
  function openDriverSheet(){const t=state.selectedTruck,driver=t?.driverAccount;if(!driver)return;document.getElementById('driverSheetCurrent').innerHTML=`<div class="dn-avatar" aria-hidden="true">${esc(initialsOf(driver.name))}</div><div><small>Current driver</small><strong>${esc(driver.name)} · ${esc(driver.telegramUserId)}</strong></div>`;const n=t.groups.length;document.getElementById('driverSheetNote').textContent=n?`${n} Telegram ${n===1?'group stays':'groups stay'} linked to ${t.name}. The new driver gets access to this truck's PTI app right away.`:`The new driver gets access to the PTI app for ${t.name} right away.`;document.getElementById('sheetDriverId').value='';document.getElementById('sheetDriverName').value='';const sheet=document.getElementById('driverSheet');clearTimeout(state.driverSheetTimer);sheet.classList.remove('closing','open');sheet.hidden=false;void sheet.offsetHeight;requestAnimationFrame(()=>sheet.classList.add('open'));state.driverSheetTimer=setTimeout(()=>document.getElementById('sheetDriverId').focus({preventScroll:true}),340)}
  function closeDriverSheet(){if(state.driverSaveBusy)return;const sheet=document.getElementById('driverSheet');if(sheet.hidden)return;clearTimeout(state.driverSheetTimer);sheet.classList.add('closing');sheet.classList.remove('open');state.driverSheetTimer=setTimeout(()=>{sheet.hidden=true;sheet.classList.remove('closing')},230)}
  async function saveDriverChange(){const t=state.selectedTruck;if(!t||state.driverSaveBusy)return;const id=document.getElementById('sheetDriverId').value.trim(),name=document.getElementById('sheetDriverName').value.trim();if(!id){toast('Enter the new driver Telegram user ID.');document.getElementById('sheetDriverId').focus();return}const button=document.getElementById('driverSheetSave');state.driverSaveBusy=true;button.disabled=true;button.textContent='Saving…';try{const data=await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/driver`,{method:'POST',body:JSON.stringify({telegramUserId:id,name,truckName:t.name,replace:true})});t.driverAccount=data.driver;state.driverSaveBusy=false;closeDriverSheet();renderTruckDetail();refreshSelectedTruckPti();toast(`Driver changed to ${data.driver.name}.`)}catch(error){toast(error.message||'Could not change driver.')}finally{state.driverSaveBusy=false;button.disabled=false;button.textContent='Save driver'}}
  function openConfirm(options){state.pendingConfirm=options;document.getElementById('groupRemoveTitle').textContent=options.title;document.getElementById('groupRemoveMessage').textContent=options.message;const button=document.getElementById('confirmGroupRemove');button.textContent=options.cta;button.disabled=false;document.getElementById('groupRemoveConfirm').hidden=false;document.getElementById('cancelGroupRemove').focus()}
  function replaceSelectedTruckGroups(groups){const t=state.selectedTruck;if(!t)return;t.groups=groups;const cached=state.trucks.find(item=>item.accountId===t.accountId&&item.id===t.id);if(cached)cached.groups=groups}
  async function loadBotGroups(){state.botGroupsLoading=true;state.botGroupsError='';try{const data=await api('/api/groups');state.botGroups=data.groups||[]}catch(error){state.botGroupsError=error.message||'request failed'}finally{state.botGroupsLoading=false;if(state.selectedTruck&&state.viewKey)renderTruckDetail()}}
  function onGroupPick(value){const wrap=document.getElementById('manualGroupWrap');if(!wrap)return;wrap.hidden=value!=='__manual';if(value==='__manual')document.getElementById('newGroupId')?.focus()}
  async function addTruckGroup(){const t=state.selectedTruck,select=document.getElementById('newGroupSelect'),input=document.getElementById('newGroupId'),button=document.getElementById('addGroupButton');if(!t||!select||state.groupAddBusy)return;let groupId=select.value;if(!groupId){toast('Choose a group first.');select.focus();return}if(groupId==='__manual'){try{groupId=normalizeGroupId(input?.value)}catch(error){toast(error.message);input?.focus();return}}state.groupAddBusy=true;if(button)button.disabled=true;try{const result=await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/groups`,{method:'POST',body:JSON.stringify({groupId,truckName:t.name})});const groups=[...t.groups];if(!groups.some(group=>group.id===result.group.id))groups.push(result.group);replaceSelectedTruckGroups(groups);if(state.botGroups&&!state.botGroups.some(g=>g.id===result.group.id))state.botGroups.push(result.group);state.groupAddBusy=false;renderTruckDetail();toast(result.notified?`Added ${result.group.name}. A notice was posted in the group.`:`Added ${result.group.name}, but the bot could not post in the group.`)}catch(error){toast(error.message||'Could not add this Telegram group.')}finally{state.groupAddBusy=false;const b=document.getElementById('addGroupButton');if(b)b.disabled=false}}
  function removeTruckGroup(groupId){const t=state.selectedTruck;if(!t)return;const group=t.groups.find(item=>item.id===groupId);if(!group)return;openConfirm({title:'Unlink Telegram group?',message:`Notifications for ${t.name} will stop going to ${group.name}. You can add the group back anytime.`,cta:'Remove group',busyText:'Removing…',errorText:'Could not remove this Telegram group.',run:async()=>{await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/groups/${encodeURIComponent(group.id)}`,{method:'DELETE'});replaceSelectedTruckGroups(t.groups.filter(item=>item.id!==group.id));renderTruckDetail();toast('Telegram group unlinked.')}})}
  function closeGroupRemoveConfirm(){if(state.groupRemoveBusy)return;document.getElementById('groupRemoveConfirm').hidden=true;state.pendingConfirm=null;state.pendingGroupRemoval=null}
  async function confirmRemoveTruckGroup(){const action=state.pendingConfirm;if(!action||state.groupRemoveBusy)return;const button=document.getElementById('confirmGroupRemove');state.groupRemoveBusy=true;button.disabled=true;button.textContent=action.busyText||'Working…';try{await action.run();document.getElementById('groupRemoveConfirm').hidden=true;state.pendingConfirm=null}catch(error){toast(error.message||action.errorText||'Something went wrong.')}finally{state.groupRemoveBusy=false;button.disabled=false;button.textContent=action.cta}}
  function openEvent(id){clearEventVideo();state.selectedEvent=state.events.find(e=>e.id===id);if(!state.selectedEvent)return;state.eventReturn='truck';renderSelectedEvent()}
  function openAlertEvent(accountId,truckId,eventId){clearEventVideo();const e=[...state.liveAlerts,...state.alertEvents].find(item=>item.accountId===accountId&&item.truckId===truckId&&item.id===eventId);if(!e)return;state.alertListVisible=false;state.selectedTruck=state.trucks.find(item=>item.accountId===accountId&&item.id===truckId)||{accountId,id:truckId,name:e.truckName,company:accountId==='1'?'U.Z. Freight':'Safe & Secure',driver:''};state.selectedEvent=e;state.eventReturn='alerts';renderSelectedEvent()}
  function eventBack(){clearEventVideo();if(state.eventReturn==='alerts'){state.alertListVisible=true;state.unreadAlertIds.clear();updateAlertsBadge();renderAlerts()}else renderTruckDetail()}
  function renderSelectedEvent(){const e=state.selectedEvent,t=state.selectedTruck;if(!e||!t)return;setView(`<button class="back" onclick="eventBack()">‹ ${esc(state.eventReturn==='alerts'?'Alerts':t.name)}</button><h1 class="detail-title">Harsh braking</h1><div class="detail-meta">${esc(t.name)} · ${esc(t.company)}</div><div class="event-detail"><div class="detail-line"><span>Date & time · New York</span>${esc(e.time)}</div><div class="detail-line"><span>Driver</span>${esc(e.driver)}</div><div class="detail-line"><span>Location</span>${e.mapUrl?`<a class="map-link" href="${esc(e.mapUrl)}" target="_blank">${esc(e.location)} ↗</a>`:esc(e.location)}</div></div><div class="video-card"><div class="video-frame"><video id="eventVideo" playsinline preload="metadata" muted></video><div class="video-cover" id="videoCover"><span class="camera-label">ROAD CAMERA · SAFETY EVENT</span><span class="video-status" id="videoStatus">Preparing video preview…</span><button class="play-video" id="playVideo" data-action="play-video" aria-label="Play video" disabled>▶</button></div></div></div><button id="sendVideo" class="primary" onclick="sendEventVideo()">Send video to my Telegram chat</button><p class="hint">The preview uses the same camera clip, telemetry overlay and size fallback as Telegram delivery. Playback is muted.</p>`);loadEventPreview()}
  async function loadEventPreview(){const e=state.selectedEvent,t=state.selectedTruck;if(!e||!t)return;const path=`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/events/${encodeURIComponent(e.id)}/video${e.eventDate?`?date=${encodeURIComponent(e.eventDate)}`:''}`;const status=document.getElementById('videoStatus'),button=document.getElementById('playVideo'),cover=document.getElementById('videoCover'),video=document.getElementById('eventVideo');try{const blob=await apiBlob(path);if(state.selectedEvent!==e)return;state.videoUrl=URL.createObjectURL(blob);video.src=state.videoUrl;await new Promise((resolve,reject)=>{if(video.readyState>=2)return resolve();video.addEventListener('loadeddata',resolve,{once:true});video.addEventListener('error',()=>reject(new Error('The video format could not be previewed.')),{once:true});video.load()});try{const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;const context=canvas.getContext('2d');context.drawImage(video,0,0,canvas.width,canvas.height);cover.style.backgroundImage=`linear-gradient(180deg,#07111b20,#07111b70),url(${canvas.toDataURL('image/jpeg',0.82)})`}catch(_){/* Keep the designed cover when thumbnail extraction is unavailable. */}status.textContent='Video ready';button.disabled=false}catch(error){if(state.selectedEvent!==e)return;status.textContent=error.message.includes('404')?'Video preview is unavailable for this event':'Could not load video preview';status.classList.add('video-unavailable');button.hidden=true;toast('Video is not available for preview. You can still request it in Telegram.')}}
  async function playEventVideo(){const video=document.getElementById('eventVideo'),cover=document.getElementById('videoCover');if(!video||!state.videoUrl)return;video.controls=true;cover.hidden=true;try{await video.play()}catch(_){cover.hidden=false;toast('Tap play again to start video playback.')}}
  async function sendEventVideo(){const b=document.getElementById('sendVideo');const e=state.selectedEvent,t=state.selectedTruck;if(!e||!t)return;b.disabled=true;b.textContent='Preparing video…';try{const result=await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/events/${encodeURIComponent(e.id)}/send${e.eventDate?`?date=${encodeURIComponent(e.eventDate)}`:''}`,{method:'POST',body:'{}'});toast(result.duplicate?'This video is already being prepared.':'Video requested. Watch for it in your Telegram chat.');b.textContent='Video requested'}catch(err){toast('Could not send video. Open the bot in a private chat first.');b.disabled=false;b.textContent='Try sending video again'}}
  async function start(){if(!tg||!initData){showError('Open FleetBot from its Telegram Mini App button.');return}setView('<div class="loading">Loading FleetBot…</div>');try{state.user=await api('/api/me');state.role=state.user.role||'admin';if(state.role==='driver'){configureDriverNavigation();state.tab='today';renderDriverToday();return}document.getElementById('roleBadge').textContent='ADMIN';const hasCachedTrucks=restoreTruckCache();if(hasCachedTrucks)renderTrucks();else setView('<div class="loading">Loading truck list…</div>');fetchTrucks().then(()=>{if(state.tab==='trucks'&&!state.selectedTruck)renderTrucks(hasCachedTrucks)}).catch(error=>{console.error('Could not refresh the truck list',error);if(!hasCachedTrucks)showError('Could not load the Samsara truck list. '+error.message);else toast('Showing the saved truck list. Tap Sync to retry.')});requestAlerts(true).then(()=>{if(state.tab==='alerts'&&!state.selectedEvent)renderAlerts();startLiveAlertPolling()})}catch(e){showError(e.message.includes('not linked')?'Your Telegram account is not linked to a truck. Ask your fleet administrator to add your Telegram ID.':'Access denied. Open the app using your linked Telegram account.')}}
  start();
</script>
