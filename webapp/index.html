  // Search filters the list as you type: only the rows and the count change, so the field keeps focus,

  async function loadEventPreview(){const e=state.selectedEvent,t=state.selectedTruck;if(!e||!t)return;const path=`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/events/${encodeURIComponent(e.id)}/video${e.eventDate?`?date=${encodeURIComponent(e.eventDate)}`:''}`;const status=document.getElementById('videoStatus'),button=document.getElementById('playVideo'),cover=document.getElementById('videoCover'),video=document.getElementById('eventVideo');try{const blob=await apiBlob(path);if(state.selectedEvent!==e)return;state.videoUrl=URL.createObjectURL(blob);video.src=state.videoUrl;await new Promise((resolve,reject)=>{if(video.readyState>=2)return resolve();video.addEventListener('loadeddata',resolve,{once:true});video.addEventListener('error',()=>reject(new Error('The video format could not be previewed.')),{once:true});video.load()});try{const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;const context=canvas.getContext('2d');context.drawImage(video,0,0,canvas.width,canvas.height);cover.style.backgroundImage=`linear-gradient(180deg,#07111b20,#07111b70),url(${canvas.toDataURL('image/jpeg',0.82)})`}catch(_){/* Keep the designed cover when thumbnail extraction is unavailable. */}status.textContent='Video ready';button.disabled=false}catch(error){if(state.selectedEvent!==e)return;status.textContent=error.message.includes('404')?'Video preview is unavailable for this event':'Could not load video preview';status.classList.add('video-unavailable');button.hidden=true;toast('Video is not available for preview. You can still request it in Telegram.')}}
  async function playEventVideo(){const video=document.getElementById('eventVideo'),cover=document.getElementById('videoCover');if(!video||!state.videoUrl)return;video.controls=true;cover.hidden=true;try{await video.play()}catch(_){cover.hidden=false;toast('Tap play again to start video playback.')}}
  async function sendEventVideo(){const b=document.getElementById('sendVideo');const e=state.selectedEvent,t=state.selectedTruck;if(!e||!t)return;b.disabled=true;b.textContent='Preparing video…';try{const result=await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/events/${encodeURIComponent(e.id)}/send${e.eventDate?`?date=${encodeURIComponent(e.eventDate)}`:''}`,{method:'POST',body:'{}'});toast(result.duplicate?'This video is already being prepared.':'Video requested. Watch for it in your Telegram chat.');b.textContent='Video requested'}catch(err){toast('Could not send video. Open the bot in a private chat first.');b.disabled=false;b.textContent='Try sending video again'}}
  async function start(){if(!tg||!initData){showError('Open FleetBot from its Telegram Mini App button.');return}setView('<div class="loading">Loading FleetBot…</div>');try{state.user=await api('/api/me');state.role=state.user.role||'admin';if(state.role==='driver'){configureDriverNavigation();state.tab='today';renderDriverToday();return}document.getElementById('roleBadge').textContent='ADMIN';const hasCachedTrucks=restoreTruckCache();if(hasCachedTrucks)renderTrucks();else setView('<div class="loading">Loading truck list…</div>');fetchTrucks().then(()=>{if(state.tab==='trucks'&&!state.selectedTruck)renderTrucks(hasCachedTrucks)}).catch(error=>{console.error('Could not refresh the truck list',error);if(!hasCachedTrucks)showError('Could not load the Samsara truck list. '+error.message);else toast('Showing the saved truck list. Tap Sync to retry.')});requestAlerts(true).then(()=>{if(state.tab==='alerts'&&!state.selectedEvent)renderAlerts();startLiveAlertPolling()})}catch(e){showError(e.message.includes('not linked')?'Your Telegram account is not linked to a truck. Ask your fleet administrator to add your Telegram ID.':'Access denied. Open the app using your linked Telegram account.')}}
  start();
</script>
