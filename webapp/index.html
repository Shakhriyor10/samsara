  </section>
</div>
<div class="photo-lightbox" id="photoLightbox" hidden onclick="if(event.target===this)closePhotoPreview()" role="dialog" aria-modal="true" aria-label="PTI photo preview">

</div>
<script>
  const tg = window.Telegram?.WebApp;
  const initData = tg?.initData || '';
  function newYorkDateString(offsetDays=0){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value]));const d=new Date(Date.UTC(Number(parts.year),Number(parts.month)-1,Number(parts.day)+offsetDays));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
  function formatNewYorkDateTime(value){const date=new Date(value);return Number.isNaN(date.getTime())?'Time unavailable':new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',dateStyle:'medium',timeStyle:'short'}).format(date)}
  const state = {tab:'trucks',role:'admin',user:null,driverStatus:null,ptiCameraStream:null,ptiCaptureSession:0,ptiPhotoIndex:0,ptiPhotos:{},ptiHistorySelection:null,filter:'all',trucks:[],selectedTruck:null,truckPti:null,truckPtiLoading:false,truckPtiError:'',ptiArchiveReturn:'settings',events:[],selectedEvent:null,videoUrl:null,eventReturn:'truck',alertFrom:newYorkDateString(-6),alertTo:newYorkDateString(),alertTruck:'all',alertEvents:[],liveAlerts:[],seenAlertIds:new Set(),unreadAlertIds:new Set(),liveAlertCursor:null,liveAlertPolling:false,liveAlertTimer:null,alertListVisible:false,alertSearched:false,alertLoading:false,alertError:'',alertRequestId:0,alertBadgeCount:0,truckEventFrom:newYorkDateString(-6),truckEventTo:newYorkDateString(),truckEventLoading:false,truckEventError:'',pendingGroupRemoval:null,groupRemoveBusy:false};
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#f5f7fa'); }
  window.addEventListener('pagehide',()=>{stopPtiCamera();revokePtiPhotoUrls();state.archiveUrls?.forEach(url=>URL.revokeObjectURL(url));clearEventVideo()});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!document.getElementById('photoLightbox').hidden)closePhotoPreview();else closeGroupRemoveConfirm()}});
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  document.getElementById('view').addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;if(target.dataset.action==='truck')openTruck(target.dataset.account,target.dataset.id);if(target.dataset.action==='event')openEvent(target.dataset.id);if(target.dataset.action==='alert-event')openAlertEvent(target.dataset.account,target.dataset.truck,target.dataset.id);if(target.dataset.action==='group-remove')removeTruckGroup(target.dataset.id);if(target.dataset.action==='play-video')playEventVideo();if(target.dataset.action==='photo-preview')openPhotoPreview(target.dataset.src,target.dataset.label)});
  const truckSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h12v11H3zM15 10h4l3 3v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>';
  async function api(path, options={}) {
    const response = await fetch(path,{...options,headers:{'X-Telegram-Init-Data':initData,'Content-Type':'application/json',...(options.headers||{})}});
    if (!response.ok) throw new Error(await response.text() || `Request failed (${response.status})`);
    return response.json();
  }
  async function apiBlob(path){const response=await fetch(path,{headers:{'X-Telegram-Init-Data':initData}});if(!response.ok)throw new Error(await response.text()||`Request failed (${response.status})`);return response.blob()}
  function clearEventVideo(){if(state.videoUrl){URL.revokeObjectURL(state.videoUrl);state.videoUrl=null}}
  function toast(message,duration=3000){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._hideTimer);el._hideTimer=setTimeout(()=>el.classList.remove('show'),duration)}
  function setView(html){document.getElementById('view').innerHTML=html;window.scrollTo({top:0,behavior:'smooth'})}
  function showError(message){setView(`<div class="error">${esc(message)}</div>`)}
  function switchTab(tab){clearEventVideo();state.selectedTruck=null;state.selectedEvent=null;if(state.role==='driver'){state.ptiCaptureSession++;stopPtiCamera();const driverTab=tab==='trucks'?'today':tab==='alerts'?'activity':tab;state.tab=driverTab;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',(driverTab==='today'&&b.dataset.tab==='trucks')||(driverTab==='pti'&&b.dataset.tab==='pti')||(driverTab==='activity'&&b.dataset.tab==='alerts')));if(driverTab==='today')renderDriverToday();else if(driverTab==='pti')renderDriverPti();else renderDriverActivity();return}state.tab=tab;state.alertListVisible=tab==='alerts';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='trucks'){renderTrucks()}else if(tab==='alerts'){state.unreadAlertIds.clear();updateAlertsBadge();renderAlerts();if(!state.alertSearched&&!state.alertLoading)loadAlerts()}else if(tab==='pti'){renderPtiSettings()}else{setView('<section class="placeholder"><div class="placeholder-icon">📊</div><strong>Reports</strong><span>This section will be available in a later step.</span></section>')}}
  function configureDriverNavigation(){document.getElementById('roleBadge').textContent='DRIVER';document.getElementById('settingsButton').hidden=true;const nav=document.querySelector('.bottom-nav');nav.classList.add('driver-nav');const buttons=[...document.querySelectorAll('.nav-btn')];buttons[0].innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h12v11H3zM15 10h4l3 3v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>Today';buttons[0].dataset.tab='trucks';buttons[1].innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16v12H4zM8 8l1.5-3h5L16 8"/><path d="m8 14 2.5 2.5L16 11"/></svg>My PTI';buttons[1].dataset.tab='pti';buttons[2].innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h17M7 17V9h3v8M13 17V5h3v12M19 17v-5h3v5"/></svg>Activity';buttons[2].dataset.tab='alerts';buttons[3].hidden=true}
  async function refreshDriverStatus(){state.driverStatus=await api('/api/pti/status');return state.driverStatus}
  function driverDueLabel(){const s=state.driverStatus;if(!s)return 'Loading PTI status…';return s.isDue?'PTI due now':`Next PTI due ${formatNewYorkDateTime(s.dueAt)}`}
  async function renderDriverToday(){let activity=[];try{await refreshDriverStatus();try{activity=(await api('/api/pti/activity')).events||[]}catch(error){console.warn('Could not load driver safety activity',error)}}catch(error){showError(error.message);return}const s=state.driverStatus,t=s.truck;const date=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'long',month:'short',day:'numeric'}).format(new Date());const activityRows=activity.length?activity.map(e=>`<div class="event-card"><span class="event-icon">⚠️</span><span class="event-content"><span class="alert-truck">${esc(e.type)}</span><span class="event-time">${esc(e.time)}</span><span class="event-desc">${esc(e.location)}</span></span></div>`).join(''):'<div class="empty">No recent safety events for your truck.</div>';const ptiSummary=s.isInvalidated?'Returned · redo required':s.lastSubmittedAt?`Submitted ${formatNewYorkDateTime(s.lastSubmittedAt)}`:'Not submitted yet';setView(`<div class="driver-date">${esc(date)} · ${esc(t.name)}</div><h1 class="driver-hello">Hi, ${esc(state.user?.name||'Driver')}.</h1><div class="driver-label">My truck</div><div class="driver-truck"><span class="truck-icon">${truckSvg}</span><span class="truck-main"><span class="truck-name">${esc(t.name)}</span><span class="truck-meta">${esc(t.company||'Assigned by fleet')}</span></span><span class="driver-status ${s.isDue?'due':''}">${s.isDue?'PTI due':'Active'}</span></div><div class="driver-stat"><span class="truck-main"><span class="truck-meta">PTI photo archive</span></span><strong>${esc(t.name)} · PTI</strong></div><div class="driver-stat"><span class="truck-main"><span class="truck-meta">${s.isInvalidated?'PTI status':s.lastSubmittedAt?'Last PTI submitted':'Today’s PTI'}</span></span><strong class="driver-status ${s.isDue?'due':''}">${esc(ptiSummary)}</strong></div><div class="driver-label">Recent safety activity</div>${activityRows}<div class="driver-card">PTI is required every ${s.intervalHours} hours. ${esc(driverDueLabel())}<button class="primary driver-cta" onclick="switchTab('pti')">${s.isDue?'Start PTI inspection':'View My PTI'}</button></div>`)}
  async function renderDriverPti(){try{await refreshDriverStatus()}catch(error){showError(error.message);return}const s=state.driverStatus;const last=s.lastSubmittedAt?formatNewYorkDateTime(s.lastSubmittedAt):'No inspection submitted yet';const windowText=s.canSubmit?`You can submit now. Next inspection is due ${formatNewYorkDateTime(s.dueAt)}.`:`You can start the next PTI after ${formatNewYorkDateTime(s.canSubmitAt)}.`;const returned=s.isInvalidated?`<div class="error">This PTI was returned. Please take and submit a new inspection.${s.invalidationReason?`<br><br>Reason: ${esc(s.invalidationReason)}`:''}</div>`:'';setView(`<button class="back" onclick="switchTab('trucks')">‹ Today</button><h1 class="detail-title">My PTI</h1><p class="sub">Complete a six-view walkaround using live camera photos. Gallery uploads are not available.</p>${returned}<div class="driver-card"><div class="driver-stat"><span class="truck-main"><span class="truck-meta">Assigned truck</span></span><strong>${esc(s.truck.name)}</strong></div><div class="driver-stat"><span class="truck-main"><span class="truck-meta">Inspection schedule</span></span><strong>Every ${s.intervalHours} hours</strong></div><div class="driver-stat"><span class="truck-main"><span class="truck-meta">Last submitted</span></span><strong>${esc(last)}</strong></div><div class="driver-stat"><span class="truck-main"><span class="truck-meta">Status</span></span><strong class="driver-status ${s.isDue?'due':''}">${s.isInvalidated?'Returned':s.isDue?'Due now':'On schedule'}</strong></div></div><div id="ptiFlow"><button class="primary" onclick="startPtiInspection()" ${s.canSubmit?'':'disabled'}>${s.isInvalidated?'Redo PTI':s.isDue?'Start today’s PTI':'Start new PTI'}</button><p class="hint">${esc(windowText)} Required photos: Front, Rear, Driver side, Passenger side, Driver cabin, and Dashboard / odometer.</p></div>`)}
  function revokePtiPhotoUrls(){for(const photo of Object.values(state.ptiPhotos))if(photo.url)URL.revokeObjectURL(photo.url);state.ptiPhotos={}}
  function stopPtiCamera(){if(state.ptiCameraStream){state.ptiCameraStream.getTracks().forEach(track=>track.stop());state.ptiCameraStream=null}}
  async function startPtiInspection(){try{await refreshDriverStatus()}catch(error){toast(error.message);return}if(!state.driverStatus.canSubmit){toast(`The next PTI can start at ${formatNewYorkDateTime(state.driverStatus.canSubmitAt)}.`);renderDriverPti();return}stopPtiCamera();revokePtiPhotoUrls();state.ptiPhotoIndex=0;await showPtiCamera()}
  function paintPtiCameraStep(){const slot=PTI_STEPS[state.ptiPhotoIndex],title=document.getElementById('ptiStepTitle'),tip=document.getElementById('ptiStepTip'),guide=document.getElementById('ptiStepGuide'),progress=document.getElementById('ptiProgress'),video=document.getElementById('ptiCamera'),review=document.getElementById('ptiReviewImage');if(!slot)return;title.textContent=slot.label;tip.textContent=`Photo ${state.ptiPhotoIndex+1} of 6 · ${slot.tip}`;guide.innerHTML=ptiGuideMarkup(slot.key);progress.style.width=`${Math.round(Object.keys(state.ptiPhotos).length/6*100)}%`;video.hidden=false;review.hidden=true;document.getElementById('capturePti').hidden=false;document.getElementById('capturePti').disabled=true;document.getElementById('retakePti').hidden=true;document.getElementById('deletePti').hidden=true;document.getElementById('usePti').hidden=true;const message=document.getElementById('cameraMessage');message.hidden=false;message.textContent='Opening camera…'}
  async function showPtiCamera(){document.body.classList.add('pti-capture');const session=state.ptiCaptureSession;const slot=PTI_STEPS[state.ptiPhotoIndex];if(!slot){renderPtiReview();return}if(!document.getElementById('ptiCapturePage'))setView(`<div id="ptiCapturePage"><button class="back" onclick="cancelPtiInspection()">‹ Cancel inspection</button><h1 class="detail-title" id="ptiStepTitle"></h1><p class="sub" id="ptiStepTip"></p><div id="ptiStepGuide"></div><div class="photo-progress"><span id="ptiProgress"></span></div><div class="camera-panel"><video id="ptiCamera" autoplay playsinline muted></video><img class="camera-review" id="ptiReviewImage" alt="Captured PTI photo" hidden><div class="camera-placeholder" id="cameraMessage">Opening camera…</div></div><div class="camera-actions"><button class="secondary-button" id="cancelPti" onclick="cancelPtiInspection()">Cancel</button><button class="secondary-button" id="retakePti" onclick="showPtiCamera()" hidden>Retake</button><button class="secondary-button" id="deletePti" onclick="deletePtiPhoto(PTI_STEPS[state.ptiPhotoIndex].key)" hidden>Delete</button><button class="capture-button" id="capturePti" onclick="capturePtiPhoto()" disabled>Take photo</button><button class="capture-button" id="usePti" onclick="acceptPtiPhoto()" hidden>Use photo &amp; continue</button></div><p class="hint">Camera access is requested once for this inspection. Review each photo before moving to the next angle.</p></div>`);document.getElementById('ptiCapturePage')?.classList.remove('pti-review');paintPtiCameraStep();try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera access requires a secure HTTPS connection and a supported browser.');let stream=state.ptiCameraStream;if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});if(session!==state.ptiCaptureSession){stream.getTracks().forEach(track=>track.stop());return}state.ptiCameraStream=stream}stream.getVideoTracks().forEach(track=>track.enabled=true);const video=document.getElementById('ptiCamera');if(!video)return;video.srcObject=stream;await video.play();const panel=video.closest('.camera-panel'),ratio=video.videoWidth&&video.videoHeight?video.videoWidth/video.videoHeight:4/3;if(panel){panel.style.aspectRatio=`${video.videoWidth||4} / ${video.videoHeight||3}`;panel.style.width=`min(100%, ${Math.max(1,42*ratio)}vh)`;panel.style.maxHeight='42vh';panel.style.marginInline='auto'}const message=document.getElementById('cameraMessage'),capture=document.getElementById('capturePti');if(message)message.hidden=true;if(capture)capture.disabled=false}catch(error){stopPtiCamera();const msg=document.getElementById('cameraMessage');if(msg)msg.textContent=error.name==='NotAllowedError'?'Allow camera access in Telegram to continue.':error.message;toast('Could not open the camera. Check camera permission and HTTPS.') }}
  async function capturePtiPhoto(){const video=document.getElementById('ptiCamera');if(!video||!video.videoWidth){toast('Wait for the camera preview, then try again.');return}const scale=Math.min(1,1600/video.videoWidth);const canvas=document.createElement('canvas');canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.88));if(!blob){toast('Could not capture this photo. Try again.');return}const slot=PTI_STEPS[state.ptiPhotoIndex];state.ptiPhotos[slot.key]={blob,url:URL.createObjectURL(blob)};state.ptiCameraStream?.getVideoTracks().forEach(track=>track.enabled=false);renderPtiPhotoReview(slot)}
  function renderPtiPhotoReview(slot){const photo=state.ptiPhotos[slot.key];document.getElementById('ptiCapturePage').classList.add('pti-review');document.getElementById('ptiStepTitle').textContent=`Review ${slot.label}`;document.getElementById('ptiStepTip').textContent='Photo ready. Retake it or use it to continue.';document.getElementById('ptiCamera').hidden=true;const review=document.getElementById('ptiReviewImage');review.src=photo.url;review.hidden=false;document.getElementById('cameraMessage').hidden=true;document.getElementById('capturePti').hidden=true;document.getElementById('retakePti').hidden=false;document.getElementById('deletePti').hidden=true;document.getElementById('usePti').hidden=false;document.getElementById('usePti').focus()}
  function deletePtiPhoto(key){const photo=state.ptiPhotos[key];if(photo?.url)URL.revokeObjectURL(photo.url);delete state.ptiPhotos[key];showPtiCamera()}
  async function cancelPtiInspection(){state.ptiCaptureSession++;document.body.classList.remove('pti-capture');stopPtiCamera();revokePtiPhotoUrls();switchTab('pti')}
  async function acceptPtiPhoto(){state.ptiPhotoIndex++;if(state.ptiPhotoIndex<PTI_STEPS.length)await showPtiCamera();else renderPtiReview()}
  function renderPtiReview(){const rows=PTI_STEPS.map((slot,index)=>{const p=state.ptiPhotos[slot.key];return `<div class="photo-step"><img class="photo-thumb" src="${p.url}" alt=""><span class="photo-step-title">${index+1}. ${esc(slot.label)}<small>Ready to submit</small></span><button onclick="retakePtiPhoto(${index})">Retake</button></div>`}).join('');setView(`<button class="back" onclick="retakePtiPhoto(0)">‹ Back to photos</button><h1 class="detail-title">Review PTI</h1><p class="sub">All six required camera photos are ready. Submit them to your fleet manager.</p>${rows}<button class="primary" id="submitPti" onclick="submitPtiInspection()">Submit PTI photos</button><p class="hint">Your submission time and all six images are saved to your PTI archive.</p>`)}
  async function retakePtiPhoto(index){const slot=PTI_STEPS[index];const old=state.ptiPhotos[slot.key];if(old?.url)URL.revokeObjectURL(old.url);delete state.ptiPhotos[slot.key];state.ptiPhotoIndex=index;await showPtiCamera()}
  async function submitPtiInspection(){const button=document.getElementById('submitPti');button.disabled=true;button.textContent='Submitting photos…';try{const form=new FormData();for(const slot of PTI_STEPS)form.append(slot.key,state.ptiPhotos[slot.key].blob,`${slot.key}.jpg`);const response=await fetch('/api/pti/submit',{method:'POST',headers:{'X-Telegram-Init-Data':initData},body:form});if(!response.ok)throw new Error(await response.text()||'Could not submit PTI');document.body.classList.remove('pti-capture');stopPtiCamera();revokePtiPhotoUrls();toast('PTI submitted successfully.');await refreshDriverStatus();renderDriverToday()}catch(error){toast(error.message||'Could not submit PTI photos.');button.disabled=false;button.textContent='Try submitting again'}}
  async function loadPtiArchivePhotos(submissionId){const results=await Promise.allSettled(PTI_STEPS.map(async slot=>({label:slot.label,url:URL.createObjectURL(await apiBlob(`/api/pti/submissions/${encodeURIComponent(submissionId)}/photos/${slot.key}`))})));const items=results.filter(result=>result.status==='fulfilled').map(result=>result.value);const failed=results.find(result=>result.status==='rejected');if(failed){items.forEach(item=>URL.revokeObjectURL(item.url));throw failed.reason}return items}
  function photoArchiveMarkup(items){return `<div class="photo-view-grid">${items.map(item=>`<figure><button class="photo-preview-button" data-action="photo-preview" data-src="${esc(item.url)}" data-label="${esc(item.label)}" aria-label="Open ${esc(item.label)} photo"><img src="${esc(item.url)}" alt="${esc(item.label)}"></button><figcaption>${esc(item.label)}</figcaption></figure>`).join('')}</div>`}
  function openPhotoPreview(src,label){const modal=document.getElementById('photoLightbox'),image=document.getElementById('photoLightboxImage');image.src=src;image.alt=label||'PTI photo';document.getElementById('photoLightboxCaption').textContent=label||'';modal.hidden=false;document.getElementById('photoLightboxClose')?.focus()}
  function closePhotoPreview(){const modal=document.getElementById('photoLightbox'),image=document.getElementById('photoLightboxImage');modal.hidden=true;image.removeAttribute('src')}
  async function renderDriverActivity(){try{await refreshDriverStatus()}catch(error){showError(error.message);return}if(state.ptiHistorySelection){await showPtiArchive(state.ptiHistorySelection);return}const rows=state.driverStatus.history.map(item=>`<div class="activity-row"><div class="driver-stat"><span class="truck-main"><strong>${item.invalidatedAt?'PTI returned':'PTI inspection'}</strong><span class="truck-meta">${esc(formatNewYorkDateTime(item.submittedAt))}${item.invalidatedAt?`<br>Returned ${esc(formatNewYorkDateTime(item.invalidatedAt))}${item.invalidationReason?` · ${esc(item.invalidationReason)}`:''}`:''}</span></span><button onclick="openPtiArchive('${item.id}')">View photos ›</button></div></div>`).join('');setView(`<h1 class="detail-title">Activity</h1><p class="sub">Your recent PTI submissions and six-view photo archive.</p>${rows||'<div class="empty">No PTI submissions yet.</div>'}`)}
  async function openPtiArchive(id){state.ptiHistorySelection=id;await showPtiArchive(id)}
  async function showPtiArchive(id){if(!document.getElementById('view'))return;setView('<div class="loading">Loading PTI photo archive…</div>');try{const items=await loadPtiArchivePhotos(id);state.archiveUrls?.forEach(url=>URL.revokeObjectURL(url));state.archiveUrls=items.map(item=>item.url);setView(`<button class="back" onclick="closePtiArchive()">‹ Activity</button><h1 class="detail-title">PTI photo archive</h1>${photoArchiveMarkup(items)}`)}catch(error){state.ptiHistorySelection=null;showError('Could not load this PTI photo archive. '+error.message)}}
  function closePtiArchive(){state.ptiHistorySelection=null;state.archiveUrls?.forEach(url=>URL.revokeObjectURL(url));state.archiveUrls=[];renderDriverActivity()}
  const PTI_STEPS=[{key:'front',label:'Front',tip:'Photograph the front of the truck.'},{key:'rear',label:'Rear',tip:'Photograph the rear and trailer connection.'},{key:'driver_side',label:'Driver side',tip:'Show the full driver side of the truck.'},{key:'passenger_side',label:'Passenger side',tip:'Show the full passenger side of the truck.'},{key:'cabin',label:'Driver cabin',tip:'Show the driver area and visible safety equipment.'},{key:'dashboard',label:'Dashboard / odometer',tip:'Capture the dashboard and current odometer.'}];
  function ptiGuideMarkup(key){const slot=PTI_STEPS.find(step=>step.key===key);const camera=(x,y)=>`<g transform="translate(${x} ${y})"><rect class="guide-camera" x="0" y="3" width="25" height="18" rx="4"/><circle class="guide-lens" cx="12.5" cy="12" r="5"/><path d="M7 3 9 0h7l2 3" fill="#fff" stroke="#2678ed" stroke-width="1.5" stroke-linejoin="round"/></g>`;let drawing='';let instruction='';if(['front','rear','driver_side','passenger_side'].includes(key)){const marks={front:{cam:[107,3],arrow:'M120 29v13m-5-6 5 6 5-6',target:[119,42]},rear:{cam:[107,150],arrow:'M120 145v-13m-5 6 5-6 5 6',target:[119,132]},driver_side:{cam:[3,77],arrow:'M31 89h38m-7-5 7 5-7 5',target:[78,89]},passenger_side:{cam:[212,77],arrow:'M209 89h-38m7-5-7 5 7 5',target:[162,89]}};const m=marks[key];drawing=`<rect class="guide-truck" x="82" y="38" width="76" height="102" rx="15"/><rect class="guide-window" x="89" y="42" width="62" height="22" rx="7"/><path d="M84 67h72v57H84z" fill="#d9e8fb" stroke="#4d83c7" stroke-width="1.5"/><path d="M89 72h60M89 80h60M89 88h60M89 96h60M89 104h60M89 112h60" stroke="#b8cee9" stroke-width="1"/><rect x="74" y="56" width="7" height="19" rx="3" fill="#34495e"/><rect x="159" y="56" width="7" height="19" rx="3" fill="#34495e"/><rect x="74" y="108" width="7" height="19" rx="3" fill="#34495e"/><rect x="159" y="108" width="7" height="19" rx="3" fill="#34495e"/><circle class="guide-target" cx="${m.target[0]}" cy="${m.target[1]}" r="5"/><path class="guide-arrow" d="${m.arrow}"/>${camera(...m.cam)}`;instruction=({front:'Stand in front of the truck and frame the grille and bumper.',rear:'Stand behind the truck and include the rear and trailer connection.',driver_side:'Stand on the driver side and capture the full side of the truck.',passenger_side:'Stand on the passenger side and capture the full side of the truck.'})[key]}else if(key==='cabin'){drawing=`<rect class="guide-interior" x="43" y="23" width="158" height="133" rx="18"/><rect class="guide-window" x="61" y="29" tion<small>${esc(instruction)}</small></div></div>`}
  async function renderPtiSettings(){
    if(state.role==='driver')return renderDriverPti();
    try{
      const settings=await api('/api/pti/settings');
      state.ptiReturnedReasons=Object.fromEntries(settings.drivers.filter(d=>d.isInvalidated).map(d=>[d.submissionId,d.invalidationReason||'PTI returned']));
      const drivers=settings.drivers.map(d=>{
        const status=d.isInvalidated?'Returned':d.isDue?'Due':'On schedule';
        const statusClass=d.isInvalidated?'returned':d.isDue?'due':'good';
        const statusGlyph=d.isInvalidated?'↻':d.isDue?'!':'✓';
        const actions=d.submissionId?`<div class="pti-actions"><button class="pti-action" aria-label="View latest photos" onclick="openAdminPtiArchive('${d.submissionId}','settings','${d.lastSubmittedAt||''}')">View</button>${d.isInvalidated?`<button class="pti-action" aria-label="Resend driver notice" onclick="resendPtiNotice('${d.submissionId}')">Resend</button>`:`<button class="pti-action danger" aria-label="Return PTI" onclick="invalidatePti('${d.submissionId}','settings')">Return</button>`}<button class="pti-action" aria-label="Request PTI" onclick="sendPtiReminder('${d.accountId}','${d.truckId}')">Request PTI</button></div>`:`<div class="pti-actions request"><button class="pti-action" aria-label="Request PTI" onclick="sendPtiReminder('${d.accountId}','${d.truckId}')">Request PTI</button></div>`;
        return `<div class="event-card pti-driver-card"><span class="pti-status-icon ${statusClass}" aria-label="${status}">${statusGlyph}</span><span class="event-content"><strong class="pti-truck-title">${esc(d.truckName)} · ${esc(d.company)}</strong><span class="pti-driver-meta">${esc(d.name)} · Telegram ${esc(d.telegramUserId)}</span><span class="pti-status-line ${statusClass}">${d.lastSubmittedAt?`Last PTI · ${esc(formatNewYorkDateTime(d.lastSubmittedAt))} · `:''}${status}${d.invalidationReason?`<br>Reason: ${esc(d.invalidationReason)}`:''}</span>${actions}</span></div>`;
      }).join('');
      setView(`<button class="back" onclick="switchTab('trucks')">‹ Trucks</button><h1 class="detail-title">PTI settings</h1><p class="sub">Set how often drivers must submit all six required inspection photos.</p><div class="pti-settings"><label for="ptiInterval">PTI interval · hours</label><input id="ptiInterval" type="number" min="1" max="168" value="${settings.intervalHours}"><button class="primary" onclick="savePtiSettings()">Save schedule</button><p class="hint">${settings.linkedDrivers} driver account(s) linked. Drivers may start 4 hours before the next due time. A one-time reminder is sent 6 hours after PTI becomes overdue.</p></div><div class="block-title">Driver compliance</div>${drivers||'<div class="empty">No drivers are linked yet. Open a truck to assign a Telegram user.</div>'}`);
    }catch(error){showError(error.message)}
  }
  async function openAdminPtiArchive(id,returnTo='settings',submittedAt=null){state.ptiArchiveReturn=returnTo;try{const items=await loadPtiArchivePhotos(id);state.archiveUrls?.forEach(url=>URL.revokeObjectURL(url));state.archiveUrls=items.map(item=>item.url);const backLabel=returnTo==='truck'?(state.selectedTruck?.name||'Truck'):'PTI settings';const submittedText=submittedAt?`Submitted ${formatNewYorkDateTime(submittedAt)}. Tap a photo to enlarge it.`:'Tap a photo to enlarge it.';setView(`<button class="back" onclick="closeAdminPtiArchive()">‹ ${esc(backLabel)}</button><h1 class="detail-title">PTI photo archive</h1><p class="sub">${esc(submittedText)}</p>${photoArchiveMarkup(items)}<button class="primary" onclick="invalidatePti('${id}','${returnTo}')">Return PTI for correction</button>`)}catch(error){toast(error.message||'Could not load PTI photos.')}}
  function closeAdminPtiArchive(){state.archiveUrls?.forEach(url=>URL.revokeObjectURL(url));state.archiveUrls=[];if(state.ptiArchiveReturn==='truck')renderTruckDetail();else renderPtiSettings()}
  async function savePtiSettings(){const intervalHours=Number(document.getElementById('ptiInterval')?.value);try{const result=await api('/api/pti/settings',{method:'POST',body:JSON.stringify({intervalHours})});toast(`PTI schedule saved: every ${result.intervalHours} hours.`);renderPtiSettings()}catch(error){toast(error.message||'Could not save PTI schedule.')}}
  async function sendPtiReminder(accountId,truckId){try{await api(`/api/trucks/${encodeURIComponent(accountId)}/${encodeURIComponent(truckId)}/pti/notify`,{method:'POST',body:'{}'});toast('PTI reminder sent to the driver in Telegram.')}catch(error){toast(error.message||'Could not send PTI reminder.')}}
  async function resendPtiNotice(submissionId){const reason=state.ptiReturnedReasons?.[submissionId];if(!reason){toast('Return reason is unavailable. Refresh PTI settings and try again.',8000);return}try{const result=await api(`/api/pti/submissions/${encodeURIComponent(submissionId)}/invalidate`,{method:'POST',body:JSON.stringify({reason})});toast(result.notificationSent?'PTI notice sent to the driver.':`PTI remains returned; Telegram rejected the message: ${result.notificationError||'unknown error'}`,10000);renderPtiSettings()}catch(error){console.error('Could not resend PTI notice',error);toast(error.message||'Could not resend the PTI notice.',10000)}}
  async function invalidatePti(submissionId,returnTo=state.ptiArchiveReturn){const reason=prompt('Why is this PTI being returned? The driver will receive this reason.');if(reason===null)return;if(reason.trim().length<3){toast('Enter a short reason so the driver knows what to correct.');return}if(!confirm('Return this PTI and require the driver to complete a new inspection?'))return;try{const result=await api(`/api/pti/submissions/${encodeURIComponent(submissionId)}/invalidate`,{method:'POST',body:JSON.stringify({reason:reason.trim()})});state.archiveUrls?.forEach(url=>URL.revokeObjectURL(url));state.archiveUrls=[];toast(result.notificationSent?'PTI returned. The driver was notified.':`PTI returned, but Telegram rejected the message: ${result.warning||'unknown error'}`,10000);if(returnTo==='truck'){state.ptiArchiveReturn='truck';await loadTruckPti();renderTruckDetail()}else{state.ptiArchiveReturn='settings';renderPtiSettings()}}catch(error){console.error('Could not return PTI',error);toast(error.message||'Could not return this PTI.',10000)}}
  function setAlertFilter(field,value){if(field==='from')state.alertFrom=value;else if(field==='to')state.alertTo=value;else state.alertTruck=value}
  function renderAlerts(){
    const options=[`<option value="all" ${state.alertTruck==='all'?'selected':''}>All trucks</option>`,...state.trucks.map(t=>{const value=`${t.accountId}::${t.id}`;return `<option value="${esc(value)}" ${state.alertTruck===value?'selected':''}>${esc(t.name)} · ${esc(t.company)}</option>`})].join('');
    const card=e=>`<button class="event-card" data-action="alert-event" data-account="${esc(e.accountId)}" data-truck="${esc(e.truckId)}" data-id="${esc(e.id)}"><span class="event-icon">🚨</span><span class="event-content"><span class="alert-truck">${esc(e.truckName)} · ${esc(e.accountId==='1'?'U.Z. Freight':'Safe & SN')}</span><span class="event-time">${esc(e.time)}</span><span class="event-desc">${esc(e.type)} · ${esc(e.location)}</span></span><span class="chevron">›</span></button>`;
    const liveSection=state.liveAlerts.length?`<div class="alert-results-head">New while this app is open · ${state.liveAlerts.length}</div>${state.liveAlerts.map(card).join('')}`:'';
    const liveKeys=new Set(state.liveAlerts.map(alertKey));const historyEvents=state.alertEvents.filter(e=>!liveKeys.has(alertKey(e)));
    const results=state.alertLoading?'<div class="loading">Searching Samsara safety events…</div>':state.alertError?`<div class="error">${esc(state.alertError)}</div>`:!state.alertSearched?'':historyEvents.length?historyEvents.map(card).join(''):'<div class="empty">No harsh-braking events found for these filters.</div>';
    setView(`<div class="section-head"><h1>Alerts</h1></div><p class="sub">New safety events appear here automatically while this app is open. Search historical harsh-braking events by date and truck.</p>${liveSection}<div class="alert-filters"><div class="alert-date-row"><div class="alert-field"><label for="alertFrom">From · New York</label><input id="alertFrom" type="date" value="${esc(state.alertFrom)}" onchange="setAlertFilter('from',this.value)"></div><div class="alert-field"><label for="alertTo">To · New York</label><input id="alertTo" type="date" value="${esc(state.alertTo)}" onchange="setAlertFilter('to',this.value)"></div></div><div class="alert-field"><label for="alertTruck">Truck</label><select id="alertTruck" onchange="setAlertFilter('truck',this.value)">${options}</select></div><button class="primary alert-search" onclick="loadAlerts()" ${state.alertLoading?'disabled':''}>${state.alertLoading?'Searching…':'Search alerts'}</button></div>${state.alertSearched&&!state.alertLoading&&!state.alertError?`<div class="alert-results-head">${historyEvents.length} event${historyEvents.length===1?'':'s'} found</div>`:''}${results}`)
  }
  function alertKey(e){return `${e.accountId}:${e.truckId}:${e.id}`}
  function updateAlertsBadge(){state.alertBadgeCount=state.unreadAlertIds.size;const badge=document.getElementById('alertsBadge');if(!badge)return;const count=state.alertBadgeCount;badge.textContent=count>99?'99+':String(count);badge.hidden=count===0}
  async function requestAlerts(initializeLive=false){
    const requestId=++state.alertRequestId;state.alertLoading=true;state.alertError='';state.alertSearched=false;
    try{const params=new URLSearchParams({from:state.alertFrom,to:state.alertTo,truck:state.alertTruck});const data=await api(`/api/alerts?${params.toString()}`);if(requestId!==state.alertRequestId)return;state.alertEvents=data.events||[];state.alertSearched=true;if(initializeLive){state.seenAlertIds=new Set(state.alertEvents.map(alertKey));state.liveAlertCursor=data.checkedAt||new Date().toISOString();state.liveAlerts=[];state.unreadAlertIds.clear();updateAlertsBadge()}}
    catch(error){if(requestId!==state.alertRequestId)return;state.alertEvents=[];state.alertError=error.message;state.alertSearched=true;if(initializeLive){state.liveAlertCursor=new Date().toISOString();state.unreadAlertIds.clear();updateAlertsBadge()}}
    finally{if(requestId===state.alertRequestId)state.alertLoading=false}
  }
  async function pollLiveAlerts(){if(!state.liveAlertCursor||state.liveAlertPolling||document.hidden)return;state.liveAlertPolling=true;try{const data=await api(`/api/alerts/live?${new URLSearchParams({since:state.liveAlertCursor})}`);state.liveAlertCursor=data.checkedAt||state.liveAlertCursor;const added=[];for(const e of data.events||[]){const key=alertKey(e);if(state.seenAlertIds.has(key))continue;state.seenAlertIds.add(key);state.liveAlerts.unshift(e);added.push(e);if(!state.alertListVisible)state.unreadAlertIds.add(key)}if(added.length){updateAlertsBadge();if(state.tab==='alerts')renderAlerts();toast(added.length===1?`New safety alert: ${added[0].truckName}`:`${added.length} new safety alerts`)}}catch(error){console.warn('Live alert polling failed',error)}finally{state.liveAlertPolling=false}}
  function startLiveAlertPolling(){if(state.liveAlertTimer)return;pollLiveAlerts();state.liveAlertTimer=setInterval(pollLiveAlerts,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollLiveAlerts()})}
  async function loadAlerts(){

  }

  function truckPtiMarkup(){if(state.truckPtiLoading)return '<div class="loading">Loading latest PTI…</div>';if(state.truckPtiError)return `<div class="error">Could not load PTI status. ${esc(state.truckPtiError)}</div>`;const pti=state.truckPti;if(!pti)return '<div class="truck-pti-card"><strong>No driver account linked</strong><p class="truck-pti-note">Link a Telegram driver account to see PTI submissions for this truck.</p></div>';const submitted=pti.lastSubmittedAt?formatNewYorkDateTime(pti.lastSubmittedAt):'No PTI submitted yet';const status=pti.isInvalidated?'Returned · new PTI required':pti.isDue?'PTI overdue':'On schedule';const statusClass=pti.isInvalidated?'returned':pti.isDue?'due':'';const actions=pti.submissionId?`<button onclick="openAdminPtiArchive('${esc(pti.submissionId)}','truck','${esc(pti.lastSubmittedAt||'')}')">View photos</button>${pti.isInvalidated?'':`<button class="danger" onclick="invalidatePti('${esc(pti.submissionId)}','truck')">Return PTI</button>`}<button onclick="sendPtiReminder('${esc(pti.accountId)}','${esc(pti.truckId)}')">Request PTI</button>`:`<button onclick="sendPtiReminder('${esc(pti.accountId)}','${esc(pti.truckId)}')">Request PTI</button>`;return `<div class="truck-pti-card"><div class="truck-pti-top"><div><div class="truck-pti-date">Last PTI</div><div class="truck-pti-note">${esc(submitted)}</div>${pti.invalidationReason?`<div class="truck-pti-note">Reason: ${esc(pti.invalidationReason)}</div>`:''}</div><div class="truck-pti-status ${statusClass}">${esc(status)}</div></div><div class="truck-pti-actions">${actions}</div></div>`}

    const linked=t.driverAccount;const driverEditor=linked?`<div class="driver-linked"><div class="driver-linked-info"><strong>${esc(linked.name)}</strong><br>Telegram ID · ${esc(linked.telegramUserId)}</div><button class="group-remove" onclick="removeTruckDriver()">Unlink</button></div>`:`<div class="admin-driver-editor"><label for="driverTelegramId">Link driver Telegram account</label><input id="driverTelegramId" type="text" inputmode="numeric" placeholder="Telegram user ID"><input id="driverName" type="text" maxlength="100" placeholder="Driver name (optional)"><button class="primary" onclick="linkTruckDriver()">Link driver to truck</button><p class="hint">Ask the driver to message the bot with /myid first, then enter that numeric ID. They can open the PTI app with /app.</p></div>`;
    const events=state.truckEventLoading?'<div class="loading">Loading safety events…</div>':state.truckEventError?`<div class="error">${esc(state.truckEventError)}</div>`:state.events.length?state.events.map(e=>`<button class="event-card" data-action="event" data-id="${esc(e.id)}"><span class="event-icon">🚨</span><span class="event-content"><span class="event-time">${esc(e.time)}</span><span class="event-desc">${esc(e.type)} · ${esc(e.location)}</span></span><span class="chevron">›</span></button>`).join(''):'<div class="empty">No harsh-braking events found for these dates.</div>';
    setView(`<button class="back" onclick="renderTrucks()">‹ Trucks</button><h1 class="detail-title">${esc(t.name)}</h1><div class="detail-meta">${esc(t.company)}${t.driver?' · '+esc(t.driver):''}</div><details class="detail-accordion"><summary>Assigned driver</summary><div class="detail-accordion-content">${driverEditor}</div></details><details class="detail-accordion"><summary>Telegram notification groups</summary><div class="detail-accordion-content">${groups}<div class="group-editor"><label for="newGroupId">Add Telegram group ID</label><input id="newGroupId" type="text" inputmode="numeric" placeholder="Group ID, with or without -100"><button class="primary" onclick="addTruckGroup()">Add group</button><p class="hint">The -100 prefix is added automatically when missing. The bot must already be in the group.</p></div></div></details><div class="block-title">Latest PTI</div>${truckPtiMarkup()}<div class="block-title">Safety events · selected dates</div><div class="truck-history-filter"><div><label for="truckEventFrom">From · New York</label><input id="truckEventFrom" type="date" value="${esc(state.truckEventFrom)}" onchange="setTruckEventFilter('from',this.value)"></div><div><label for="truckEventTo">To · New York</label><input id="truckEventTo" type="date" value="${esc(state.truckEventTo)}" onchange="setTruckEventFilter('to',this.value)"></div><button class="refresh" onclick="loadTruckEvents()" ${state.truckEventLoading?'disabled':''}>${state.truckEventLoading?'Loading…':'Filter events'}</button></div>${events}`)
  }
  function normalizeGroupId(value){const digits=String(value||'').trim().replace(/^-+/,'');if(!/^\d{4,18}$/.test(digits))throw new Error('Enter a valid numeric Telegram group ID.');return `-${digits.startsWith('100')?digits:`100${digits}`}`}
  async function linkTruckDriver(){const t=state.selectedTruck,id=document.getElementById('driverTelegramId')?.value.trim(),name=document.getElementById('driverName')?.value.trim();if(!t||!id){toast('Enter the driver Telegram user ID.');return}try{const data=await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/driver`,{method:'POST',body:JSON.stringify({telegramUserId:id,name,truckName:t.name})});t.driverAccount=data.driver;toast('Driver account linked. The driver can open /app in a private chat.');renderTruckDetail()}catch(error){toast(error.message||'Could not link driver account.')}}
  async function removeTruckDriver(){const t=state.selectedTruck;if(!t?.driverAccount||!confirm(`Unlink ${t.driverAccount.name} from ${t.name}?`))return;try{await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/driver`,{method:'DELETE'});t.driverAccount=null;toast('Driver unlinked.');renderTruckDetail()}catch(error){toast(error.message||'Could not unlink driver.')}}
  function replaceSelectedTruckGroups(groups){const t=state.selectedTruck;if(!t)return;t.groups=groups;const cached=state.trucks.find(item=>item.accountId===t.accountId&&item.id===t.id);if(cached)cached.groups=groups}
  async function addTruckGroup(){const t=state.selectedTruck,input=document.getElementById('newGroupId');if(!t||!input)return;let groupId;try{groupId=normalizeGroupId(input.value)}catch(error){toast(error.message);return}input.value=groupId;try{const result=await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/groups`,{method:'POST',body:JSON.stringify({groupId,truckName:t.name})});const groups=[...t.groups];if(!groups.some(group=>group.id===result.group.id))groups.push(result.group);replaceSelectedTruckGroups(groups);renderTruckDetail();toast('Telegram group added.')}catch(error){toast(error.message||'Could not add this Telegram group.')}}
  function removeTruckGroup(groupId){const t=state.selectedTruck;if(!t)return;const group=t.groups.find(item=>item.id===groupId);if(!group)return;state.pendingGroupRemoval=group;document.getElementById('groupRemoveMessage').textContent=`Are you sure you want to unlink ${t.name} from ${group.name}? Notifications for this truck will stop going to this group.`;document.getElementById('groupRemoveConfirm').hidden=false;document.getElementById('cancelGroupRemove').focus()}
  function closeGroupRemoveConfirm(){if(state.groupRemoveBusy)return;document.getElementById('groupRemoveConfirm').hidden=true;state.pendingGroupRemoval=null}
  async function confirmRemoveTruckGroup(){const t=state.selectedTruck,group=state.pendingGroupRemoval;if(!t||!group||state.groupRemoveBusy)return;const button=document.getElementById('confirmGroupRemove');state.groupRemoveBusy=true;button.disabled=true;button.textContent='Removing…';try{await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/groups/${encodeURIComponent(group.id)}`,{method:'DELETE'});replaceSelectedTruckGroups(t.groups.filter(item=>item.id!==group.id));document.getElementById('groupRemoveConfirm').hidden=true;state.pendingGroupRemoval=null;renderTruckDetail();toast('Telegram group unlinked.')}catch(error){toast(error.message||'Could not remove this Telegram group.')}finally{state.groupRemoveBusy=false;button.disabled=false;button.textContent='Remove group'}}
  function openEvent(id){clearEventVideo();state.selectedEvent=state.events.find(e=>e.id===id);if(!state.selectedEvent)return;state.eventReturn='truck';renderSelectedEvent()}
  function openAlertEvent(accountId,truckId,eventId){clearEventVideo();const e=[...state.liveAlerts,...state.alertEvents].find(item=>item.accountId===accountId&&item.truckId===truckId&&item.id===eventId);if(!e)return;state.alertListVisible=false;state.selectedTruck=state.trucks.find(item=>item.accountId===accountId&&item.id===truckId)||{accountId,id:truckId,name:e.truckName,company:accountId==='1'?'U.Z. Freight':'Safe & SN',driver:''};state.selectedEvent=e;state.eventReturn='alerts';renderSelectedEvent()}
  function eventBack(){clearEventVideo();if(state.eventReturn==='alerts'){state.alertListVisible=true;state.unreadAlertIds.clear();updateAlertsBadge();renderAlerts()}else renderTruckDetail()}
  function renderSelectedEvent(){const e=state.selectedEvent,t=state.selectedTruck;if(!e||!t)return;setView(`<button class="back" onclick="eventBack()">‹ ${esc(state.eventReturn==='alerts'?'Alerts':t.name)}</button><h1 class="detail-title">Harsh braking</h1><div class="detail-meta">${esc(t.name)} · ${esc(t.company)}</div><div class="event-detail"><div class="detail-line"><span>Date & time · New York</span>${esc(e.time)}</div><div class="detail-line"><span>Driver</span>${esc(e.driver)}</div><div class="detail-line"><span>Location</span>${e.mapUrl?`<a class="map-link" href="${esc(e.mapUrl)}" target="_blank">${esc(e.location)} ↗</a>`:esc(e.location)}</div></div><div class="video-card"><div class="video-frame"><video id="eventVideo" playsinline preload="metadata" muted></video><div class="video-cover" id="videoCover"><span class="camera-label">ROAD CAMERA · SAFETY EVENT</span><span class="video-status" id="videoStatus">Preparing video preview…</span><button class="play-video" id="playVideo" data-action="play-video" aria-label="Play video" disabled>▶</button></div></div></div><button id="sendVideo" class="primary" onclick="sendEventVideo()">Send video to my Telegram chat</button><p class="hint">The preview uses the same camera clip, telemetry overlay and size fallback as Telegram delivery. Playback is muted.</p>`);loadEventPreview()}
  async function loadEventPreview(){const e=state.selectedEvent,t=state.selectedTruck;if(!e||!t)return;const path=`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/events/${encodeURIComponent(e.id)}/video${e.eventDate?`?date=${encodeURIComponent(e.eventDate)}`:''}`;const status=document.getElementById('videoStatus'),button=document.getElementById('playVideo'),cover=document.getElementById('videoCover'),video=document.getElementById('eventVideo');try{const blob=await apiBlob(path);if(state.selectedEvent!==e)return;state.videoUrl=URL.createObjectURL(blob);video.src=state.videoUrl;await new Promise((resolve,reject)=>{if(video.readyState>=2)return resolve();video.addEventListener('loadeddata',resolve,{once:true});video.addEventListener('error',()=>reject(new Error('The video format could not be previewed.')),{once:true});video.load()});try{const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;const context=canvas.getContext('2d');context.drawImage(video,0,0,canvas.width,canvas.height);cover.style.backgroundImage=`linear-gradient(180deg,#07111b20,#07111b70),url(${canvas.toDataURL('image/jpeg',0.82)})`}catch(_){/* Keep the designed cover when thumbnail extraction is unavailable. */}status.textContent='Video ready';button.disabled=false}catch(error){if(state.selectedEvent!==e)return;status.textContent=error.message.includes('404')?'Video preview is unavailable for this event':'Could not load video preview';status.classList.add('video-unavailable');button.hidden=true;toast('Video is not available for preview. You can still request it in Telegram.')}}
  async function playEventVideo(){const video=document.getElementById('eventVideo'),cover=document.getElementById('videoCover');if(!video||!state.videoUrl)return;video.controls=true;cover.hidden=true;try{await video.play()}catch(_){cover.hidden=false;toast('Tap play again to start video playback.')}}
  async function sendEventVideo(){const b=document.getElementById('sendVideo');const e=state.selectedEvent,t=state.selectedTruck;if(!e||!t)return;b.disabled=true;b.textContent='Preparing video…';try{const result=await api(`/api/trucks/${encodeURIComponent(t.accountId)}/${encodeURIComponent(t.id)}/events/${encodeURIComponent(e.id)}/send${e.eventDate?`?date=${encodeURIComponent(e.eventDate)}`:''}`,{method:'POST',body:'{}'});toast(result.duplicate?'This video is already being prepared.':'Video requested. Watch for it in your Telegram chat.');b.textContent='Video requested'}catch(err){toast('Could not send video. Open the bot in a private chat first.');b.disabled=false;b.textContent='Try sending video again'}}
  async function start(){if(!tg||!initData){showError('Open FleetBot from its Telegram Mini App button.');return}setView('<div class="loading">Loading FleetBot…</div>');try{state.user=await api('/api/me');state.role=state.user.role||'admin';if(state.role==='driver'){configureDriverNavigation();state.tab='today';renderDriverToday();return}document.getElementById('roleBadge').textContent='ADMIN';const [truckResult]=await Promise.allSettled([fetchTrucks(),requestAlerts(true)]);if(truckResult.status==='rejected'){showError('Could not load the Samsara truck list. '+truckResult.reason.message);return}if(state.tab==='alerts')renderAlerts();else renderTrucks();startLiveAlertPolling()}catch(e){showError(e.message.includes('not linked')?'Your Telegram account is not linked to a truck. Ask your fleet administrator to add your Telegram ID.':'Access denied. Open the app using your linked Telegram account.')}}
  start();
</script>
