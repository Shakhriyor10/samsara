# systemd drop-in for samsara-bot.service: give the bot priority over the other projects on the VPS.
# Install as /etc/systemd/system/samsara-bot.service.d/priority.conf (see deploy/README.md).
# Nothing here limits other services while resources are free; they only yield when the server is busy.
[Service]
# Memory the kernel never reclaims or swaps out from the bot, even under memory pressure.
MemoryMin=384M
# Up to 1 GB is protected: when memory runs short, other services are reclaimed first.
MemoryLow=1G
# CPU and disk shares relative to the default of 100: under contention the bot gets 4x the time.
# FFmpeg runs inside this service, so video preparation gets the same priority.
CPUWeight=400
IOWeight=400
# If the server ever runs out of memory, the kernel stops another process before this bot.
OOMScoreAdjust=-500
